version: '3.8'

# Production docker-compose file
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_LEVEL=error
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-StrongRootPassword123!}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-StrongPassword123!}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-RedisPassword123!}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Remove or comment out Mailhog in production
  # Use real mail service instead
  # mailhog:
  #   profiles:
  #     - dev
